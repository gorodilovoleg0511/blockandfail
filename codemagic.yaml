workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      node: latest
      java: 17
    scripts:
      - name: Setup and Build
        script: |
          # 1. Распаковываем архив
          unzip -o *.zip
          
          # 2. Ищем файл игры
          HTML_FILE=$(find . -name "index.html" | head -n 1)
          
          # 3. Устанавливаем Capacitor
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          
          # 4. Копируем игру
          mkdir www
          cp "$HTML_FILE" www/index.html
          
          # 5. Инициализируем Android
          npx cap init "Block and Fail" com.mute17.blockandfail --web-dir=www
          npx cap add android
          
          npx cap sync
          
          # 6. Принудительно ставим Java 17 в Gradle
          echo "org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64" >> android/gradle.properties
          
          # 7. Собираем APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - gorodilovoleg0511@gmail.com
        notify:
          success: true
          failure: true
