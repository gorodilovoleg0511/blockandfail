workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      java: 17
    scripts:
      - name: Setup and Build
        script: |
          # 1. Распаковываем архив
          unzip -o *.zip
          
          # 2. Ищем файл игры (index.html)
          HTML_FILE=$(find . -name "index.html" | head -n 1)
          
          # 3. Устанавливаем Capacitor (обертку для APK)
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          
          # 4. Копируем игру в папку www
          mkdir www
          cp "$HTML_FILE" www/index.html
          
          # 5. Инициализируем Android-проект
          npx cap init "Block and Fail" com.mute17.blockandfail --web-dir=www
          npx cap add android
          
          # 6. Делаем полноэкранный режим (убираем панели)
          sed -i 's/Theme.AppCompat.Light.NoActionBar/Theme.AppCompat.Light.NoActionBar.Fullscreen/g' android/app/src/main/res/values/styles.xml || true
          sed -i 's/Theme.AppCompat.Light.DarkActionBar/Theme.AppCompat.Light.NoActionBar.Fullscreen/g' android/app/src/main/res/values/styles.xml || true

          npx cap sync
          
          # 7. Собираем APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - gorodilovoleg0511@gmail.com
        notify:
          success: true
          failure: true
