workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: linux_x1
    environment:
      node: latest
      java: 17
    scripts:
      - name: Setup and Build
        script: |
          # 1. Распаковываем архив
          unzip -o *.zip
          
          # 2. Ищем файл игры
          HTML_FILE=$(find . -name "index.html" | head -n 1)
          
          # 3. Устанавливаем Capacitor 5 версии (стабильная)
          npm init -y
          npm i @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
          
          # 4. Копируем игру
          mkdir www
          cp "$HTML_FILE" www/index.html
          
          # 5. Инициализируем Android
          npx cap init "Block and Fail" com.mute17.blockandfail --web-dir=www
          npx cap add android
          
          npx cap sync
          
          # 6. Жестко прописываем Java 17 для Capacitor и проекта
          echo "org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64" > android/gradle.properties
          echo "org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64" > android/app/gradle.properties || true
          echo "org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64" > android/capacitor-android/gradle.properties || true
          
          # 7. Убираем требование Java 21 из самого кода
          sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_17/g' android/capacitor-android/build.gradle || true
          sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_17/g' android/app/build.gradle || true
          
          # 8. Собираем APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - gorodilovoleg0511@gmail.com
        notify:
          success: true
          failure: true
